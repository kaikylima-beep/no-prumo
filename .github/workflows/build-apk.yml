# Testes em todo push.
# APK + Release quando a versão do app.json ainda não tem Release (é só subir a troca de versão em main),
# ou quando alguém clica em "Run workflow" (gera o APK; cria a Release só se ainda não existir).
name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      nova: ${{ steps.ver.outputs.nova }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Versão nova?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./app.json').expo.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "nova=false" >> "$GITHUB_OUTPUT"; echo "A versão $V já tem Release."
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"; echo "Versão $V ainda sem Release."
          fi

  apk:
    name: APK
    needs: testes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.testes.outputs.nova == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      V: ${{ needs.testes.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --no-audit --no-fund

      - name: Gerar a pasta android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Assinatura de sempre e memória do Gradle
        run: |
          cp keystore/debug.keystore android/app/debug.keystore
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Gerar o APK (assembleRelease)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          NODE_ENV: production

      - name: Conferir o APK
        run: bash scripts/check-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Dar nome ao APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Prumo-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Prumo-${{ env.V }}
          path: Prumo-${{ env.V }}.apk
          retention-days: 30

      - name: Criar a Release com o APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "A Release v$V já existe; o APK ficou só nos artefatos desta execução."; exit 0
          fi
          NOTES=$(awk -v v="$V" '
            /^## / { on = (index($0, " " v " ") || index($0, " " v ":") || $0 ~ (" " v "$")) }
            on' README.md)
          gh release create "v$V" "Prumo-$V.apk" --target "$GITHUB_SHA" \
            --title "No Prumo $V" --notes "${NOTES:-Versão $V}"
